<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueVerse – One Platform, Every Business</title>
<style>
  body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0b1a2f;
    color: #fff;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  #app {
    position: relative;
    width: 100%; height: 100%;
  }
  .narration-bar {
    position: absolute;
    top: 20px; left: 20px; right: 20px;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    padding: 15px 25px;
    border-radius: 16px;
    font-size: 1.2em;
    font-weight: 300;
    text-align: center;
    z-index: 100;
    max-width: 900px;
    margin: 0 auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .scene-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #1a2f44 0%, #0b1a2f 90%);
  }
  .core {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3b8cff, #0f2b5c);
    box-shadow: 0 0 40px rgba(59,140,255,0.6);
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 1.1em;
    text-align: center;
    color: white;
    transition: all 0.5s ease;
    z-index: 10;
    position: relative;
  }
  .business-card {
    position: absolute;
    padding: 15px 25px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 1em;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    transition: opacity 0.5s ease;
    display: flex; flex-direction: column; align-items: center;
    min-width: 150px;
  }
  .module-tag {
    background: rgba(255,255,255,0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75em;
    margin: 2px;
    display: inline-block;
  }
  .module-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 700px;
  }
  .module-grid-item {
    background: rgba(255,255,255,0.1);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: 500;
    text-align: center;
  }
  .controls {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    z-index: 200;
  }
  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
    background: #2c5282;
    color: white;
    transition: background 0.2s;
  }
  .btn:hover { background: #1e3a5f; }
  #scene-counter {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.85em;
    color: #aaa;
    z-index: 150;
  }
  .phone-mockup {
    background: #fff;
    border-radius: 20px;
    border: 4px solid #444;
    width: 180px;
    height: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #000;
    font-size: 0.8em;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <div class="narration-bar" id="narration"></div>
  <div class="scene-container" id="scene"></div>
  <div id="scene-counter">Scene 1 / 15</div>
  <div class="controls">
    <button class="btn" id="prevBtn">Prev</button>
    <button class="btn" id="autoBtn">Auto Play (On)</button>
    <button class="btn" id="nextBtn">Next</button>
  </div>
</div>

<script>
const moduleList = [
  "Multi-Business Architecture", "Service & Product Catalogue", "Transaction Processing",
  "Discounts & Promotions", "Membership & Subscription", "Service Books",
  "Warranty Management", "B2B Contract Management", "B2G Commercial",
  "Loyalty", "Gift Cards & Vouchers", "Cash Management", "Staff Management",
  "Analytics & Reporting", "Multi-Country & Localisation", "Privacy & Security",
  "Queue Management", "Execution (Job Cards)", "Post-Wash Quality",
  "Equipment Integration & IoT", "Staff Productivity", "Idle Time & Downtime",
  "Utility Monitoring", "Field Service", "Inventory Management",
  "Revenue & Expense", "Vision AI", "SOP Management", "ESG Platform",
  "HR Management", "Industrial Relations", "Compliance Renewal",
  "Admin Control", "Accident Management", "Project Management", "SaaS Multi-Tenancy"
];

const scenes = [
  {
    narration: "It begins with a single, powerful operations platform – not software built for just one business, but a universal engine that can run any vehicle service operation.",
    build: (container) => {
      container.innerHTML = '';
      let core = createCore('Platform Core', true);
      container.appendChild(core);
    }
  },
  {
    narration: "Configure Vehicle Wash in minutes. The system already knows exactly what a wash station needs – POS, queue management, job cards, equipment control, and even AI‑powered quality inspection.",
    build: (container) => {
      container.innerHTML = '';
      let core = createCore('Platform Core', false);
      container.appendChild(core);
      let card = createBusinessCard('Vehicle Wash', '#d5e8d4', '#1e3b2f');
      placeCard(card, '20%', '30%');
      addModules(card, ['POS','Queue','Job Cards','Equipment IoT','Vision AI']);
      container.appendChild(card);
    }
  },
  {
    narration: "Now add Detailing. The same Core – but the modules automatically adjust. A booking calendar instead of a drive‑thru queue, warranty management for coatings, and AI that compares before‑and‑after photos.",
    build: (container) => {
      container.innerHTML = '';
      let core = createCore('Platform Core', false);
      container.appendChild(core);
      let card = createBusinessCard('Detailing Studios', '#e1d5e7', '#3b2e4a');
      placeCard(card, '65%', '30%');
      addModules(card, ['Booking Calendar','Job Cards','Warranty','Inventory','Vision AI']);
      container.appendChild(card);
    }
  },
  {
    narration: "Switch on mobile wash. The platform transforms into a dispatch hub – app‑based POS, real‑time technician tracking, and van inventory management – all from the same Core.",
    build: (container) => {
      container.innerHTML = '';
      let core = createCore('Platform Core', false);
      container.appendChild(core);
      let card = createBusinessCard('Wash on the Go', '#ffe6cc', '#5c3a00');
      placeCard(card, '15%', '65%');
      addModules(card, ['App POS','Dispatch Queue','Job Cards','Utility','Van Inventory']);
      container.appendChild(card);
    }
  },
  {
    narration: "Add a product sales business. The platform becomes a full retail engine – barcode POS, bulk invoicing, inventory tracking, and product warranty – without any new software.",
    build: (container) => {
      container.innerHTML = '';
      let core = createCore('Platform Core', false);
      container.appendChild(core);
      let card = createBusinessCard('Product Sales', '#cce5ff', '#003b66');
      placeCard(card, '70%', '60%');
      addModules(card, ['e-commerce POS','Warehouse Inventory','Warranty','Revenue']);
      container.appendChild(card);
    }
  },
  {
    narration: "The platform itself is a SaaS product. Every business line can be deployed as an isolated tenant for franchisees or dealerships. And every new site – from survey to handover – is managed by the built‑in project management engine.",
    build: (container) => {
      container.innerHTML = '';
      let core = createCore('Platform Core', false);
      container.appendChild(core);
      let saasCard = createBusinessCard('SaaS', '#dae8fc', '#1f3b5c');
      placeCard(saasCard, '25%', '70%');
      addModules(saasCard, ['Tenant Config','Role Access','Central Sync']);
      container.appendChild(saasCard);
      let projCard = createBusinessCard('Project Mgmt', '#ffe6cc', '#5c4000');
      placeCard(projCard, '60%', '70%');
      addModules(projCard, ['Site Rollout','Milestones','Budget']);
      container.appendChild(projCard);
    }
  },
  {
    narration: "At the heart of the platform are twenty‑seven operational modules. They are never duplicated – just configured differently for each business type.",
    build: (container) => {
      container.innerHTML = '';
      // Only show core with "27 Modules" and a grid of module names
      let core = createCore('27 Modules', true);
      core.style.width = '160px'; core.style.height = '160px'; core.style.fontSize = '1em';
      container.appendChild(core);
      // Add grid of modules below core (slightly offset)
      let grid = document.createElement('div');
      grid.className = 'module-grid';
      grid.style.marginTop = '30px';
      moduleList.slice(0,27).forEach(name => {
        let item = document.createElement('div');
        item.className = 'module-grid-item';
        item.textContent = name;
        grid.appendChild(item);
      });
      container.style.flexDirection = 'column';
      container.appendChild(grid);
    }
  },
  {
    narration: "The same ‘Queue’ module behaves as a drive‑thru lane for a wash, a booking calendar for detailing, and a dispatch board for mobile services. Configuration, not custom code.",
    build: (container) => {
      container.innerHTML = '';
      // show the core and three businesses with queue transformations
      let core = createCore('Platform Core', false);
      container.appendChild(core);
      let wash = createBusinessCard('Vehicle Wash', '#d5e8d4', '#1e3b2f');
      placeCard(wash, '15%', '25%');
      wash.innerHTML += '<br><span style="font-size:0.7em;">Queue = Physical Lane</span>';
      container.appendChild(wash);
      let detail = createBusinessCard('Detailing', '#e1d5e7', '#3b2e4a');
      placeCard(detail, '55%', '25%');
      detail.innerHTML += '<br><span style="font-size:0.7em;">Queue = Booking Calendar</span>';
      container.appendChild(detail);
      let mobile = createBusinessCard('Mobile', '#ffe6cc', '#5c3a00');
      placeCard(mobile, '35%', '65%');
      mobile.innerHTML += '<br><span style="font-size:0.7em;">Queue = Dispatch Board</span>';
      container.appendChild(mobile);
    }
  },
  {
    narration: "Managers configure their business through simple admin panels – service menus, pricing, job card templates, and SOPs – all within the same platform, no developer needed.",
    build: (container) => {
      container.innerHTML = '';
      let settings = document.createElement('div');
      settings.style.cssText = 'background:rgba(255,255,255,0.15); backdrop-filter:blur(12px); padding:40px; border-radius:24px; text-align:center;';
      settings.innerHTML = '<h2>⚙️ Admin Panel</h2><p>Service Catalogue</p><p>Pricing Rules</p><p>Job Card Templates</p><p>SOPs</p>';
      container.appendChild(settings);
    }
  },
  {
    narration: "Need a completely new business type? Just run the wizard – name it, select the modules it needs, and it’s instantly available across the entire platform, with all standard features ready to go.",
    build: (container) => {
      container.innerHTML = '';
      let wizard = document.createElement('div');
      wizard.style.cssText = 'background:white; color:#000; padding:30px; border-radius:20px; text-align:center;';
      wizard.innerHTML = '<h2>Add Business Type</h2><p>Oil Change Service</p><p style="font-size:0.8em;">Select modules...</p><button style="background:#1e90ff;color:white;border:none;padding:8px 20px;border-radius:20px;">Create</button>';
      container.appendChild(wizard);
    }
  },
  {
    narration: "Scale from one site to a thousand, across fifty countries. Every location, every business type, all orchestrated from the same central platform.",
    build: (container) => {
      container.innerHTML = '';
      // world map effect with glowing dots
      let core = createCore('Platform Core', false);
      container.appendChild(core);
      for(let i=0; i<8; i++) {
        let dot = document.createElement('div');
        dot.style.cssText = `position:absolute; width:12px; height:12px; border-radius:50%; background:#1e90ff; box-shadow:0 0 12px #1e90ff; left:${10+Math.random()*80}%; top:${10+Math.random()*80}%;`;
        container.appendChild(dot);
      }
    }
  },
  {
    narration: "Leaders get a unified operations view – real‑time dashboards, cross‑business analytics, and automated reporting for every site and every business line.",
    build: (container) => {
      container.innerHTML = '';
      let left = document.createElement('div');
      left.style.cssText = 'background:rgba(0,0,0,0.6); border-radius:16px; padding:20px; margin:0 20px; text-align:center; width:250px;';
      left.innerHTML = '📊 Operations Dashboard';
      container.appendChild(left);
      let right = document.createElement('div');
      right.style.cssText = 'background:rgba(0,0,0,0.6); border-radius:16px; padding:20px; margin:0 20px; text-align:center; width:250px;';
      right.innerHTML = '📈 Reports & Analytics';
      container.appendChild(right);
    }
  },
  {
    narration: "And customers see none of the complexity – they just open one app, book anything, anywhere, and the platform orchestrates it all.",
    build: (container) => {
      container.innerHTML = '';
      let phone = document.createElement('div');
      phone.className = 'phone-mockup';
      phone.innerHTML = '<strong>BlueVerse</strong><br>Wash<br>Detailing<br>Mobile Booking<br>Shop';
      container.appendChild(phone);
    }
  },
  {
    narration: "An AI‑driven operations platform that builds once and runs any mobility service business, at any scale, anywhere in the world.",
    build: (container) => {
      container.innerHTML = '';
      let core = createCore('AI Platform', true);
      core.style.width = '160px'; core.style.height = '160px';
      container.appendChild(core);
    }
  },
  {
    narration: "BlueVerse – www.blueverse.com",
    build: (container) => {
      container.innerHTML = '';
      let logo = document.createElement('div');
      logo.style.cssText = 'font-size:3.5em; font-weight:bold; color:#1e90ff; text-shadow:0 0 20px rgba(30,144,255,0.7);';
      logo.textContent = 'BlueVerse';
      container.appendChild(logo);
    }
  }
];

function createCore(text, pulse = false) {
  let core = document.createElement('div');
  core.className = 'core';
  if(pulse) core.classList.add('pulse');
  core.textContent = text;
  return core;
}

function createBusinessCard(title, bgColor, textColor) {
  let card = document.createElement('div');
  card.className = 'business-card';
  card.style.background = bgColor + 'cc';
  card.style.color = textColor;
  card.innerHTML = `<strong>${title}</strong>`;
  return card;
}

function placeCard(card, left, top) {
  card.style.left = left;
  card.style.top = top;
}

function addModules(card, modules) {
  let div = document.createElement('div');
  div.style.display = 'flex'; div.style.flexWrap = 'wrap'; div.style.justifyContent = 'center'; div.style.marginTop = '8px';
  modules.forEach(m => {
    let span = document.createElement('span');
    span.className = 'module-tag';
    span.textContent = m;
    div.appendChild(span);
  });
  card.appendChild(div);
}

let current = 0;
let autoplay = true;
let interval;

const narrationEl = document.getElementById('narration');
const sceneEl = document.getElementById('scene');
const counterEl = document.getElementById('scene-counter');
const autoBtn = document.getElementById('autoBtn');

function renderScene(idx) {
  narrationEl.textContent = scenes[idx].narration;
  counterEl.textContent = `Scene ${idx+1} / ${scenes.length}`;
  // Reset scene container flex direction to row
  sceneEl.style.flexDirection = 'row';
  scenes[idx].build(sceneEl);
}

function next() {
  if (current < scenes.length-1) {
    current++;
    renderScene(current);
  }
}

function prev() {
  if (current > 0) {
    current--;
    renderScene(current);
  }
}

function toggleAuto() {
  autoplay = !autoplay;
  autoBtn.textContent = autoplay ? 'Auto Play (On)' : 'Auto Play (Off)';
  if (autoplay) startAuto();
  else clearInterval(interval);
}

function startAuto() {
  clearInterval(interval);
  interval = setInterval(() => {
    if (current < scenes.length-1) {
      current++;
      renderScene(current);
    } else {
      clearInterval(interval);
    }
  }, 8000);
}

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
autoBtn.addEventListener('click', toggleAuto);

// Initialise
renderScene(0);
startAuto();
</script>
</body>
</html>
