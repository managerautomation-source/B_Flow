<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG & Sustainability – 5‑Stage Business Coverage (with Lab Reports)</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #f5f7fa; }
  h1 { text-align: center; color: #222; }
  .tabs { display: flex; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
  .tab { background: #e0e0e0; padding: 10px 20px; margin: 5px; border-radius: 20px; cursor: pointer; font-weight: 600; color: #333; }
  .tab.active { background: #2e7d32; color: white; }
  .diagram-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow-x: auto; }
  .mermaid { display: flex; justify-content: center; }
</style>
</head>
<body>
<h1>🌱 ESG & Sustainability – 5‑Stage Module Coverage (with Lab & ETP)</h1>
<div class="tabs" id="tabs"></div>
<div class="diagram-container">
  <div class="mermaid" id="diagram"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  mermaid.initialize({ startOnLoad: false, theme: 'default' });

  // ─────────── 1) VEHICLE WASH ───────────
  const vehicleWash = `flowchart TD
    subgraph Stage1 ["1) Foundation & Governance"]
      direction LR
      subgraph S1Col1 [ ]
        G1["ESG Policy & Strategy"]
        G2["Framework Alignment (GRI, SASB, BRSR)"]
        G3["SDG Goal Mapping (6, 12, 13)"]
      end
      subgraph S1Col2 [ ]
        G4["Goal Setting (Water, Energy, Carbon)"]
        G5["Org Hierarchy & RBAC"]
        G6["Compliance Calendar & Permit Registry"]
      end
    end
    subgraph Stage2 ["2) Data Collection & IoT Pipeline"]
      direction LR
      subgraph S2Col1 [ ]
        D1["Sensor Registry & Configuration"]
        D2["PLC Data Aggregation (BV-PLC)"]
        D3["Edge Gateway Management"]
        D7["Lab Report Scheduler & Template"]
      end
      subgraph S2Col2 [ ]
        D4["Offline Buffer & Auto-Sync"]
        D5["Telemetry Ingestion (Water, Energy, Chemical, Air)"]
        D6["Waste & Sludge Sensors"]
        D8["Manual Metric Entry for Lab Results<br/>(pH, TDS, COD, BOD, etc.)"]
      end
    end
    subgraph Stage3 ["3) Monitoring & Real-Time Insights"]
      direction LR
      subgraph S3Col1 [ ]
        M1["Per-Wash Water & Energy Metrics"]
        M2["Chemical Usage Per Wash"]
        M3["Equipment-Level Consumption"]
        M4["Site-Level Dashboards"]
        M9["Water Quality Dashboard<br/>(TDS, pH, COD vs Standards)"]
      end
      subgraph S3Col2 [ ]
        M5["Leakage & Anomaly Detection"]
        M6["Sustainability Score (per service)"]
        M7["Air Quality Monitoring"]
        M8["Waste & ETP Performance"]
        M10["ETP Performance Score<br/>(% Removal Efficiency)"]
      end
    end
    subgraph Stage4 ["4) Compliance & Regulatory Mgmt"]
      direction LR
      subgraph S4Col1 [ ]
        C1["Permit Condition Monitoring"]
        C2["Threshold Alerts & Breach Notifications<br/>(Inc. Lab Data)"]
        C3["Corrective Action Tracking"]
      end
      subgraph S4Col2 [ ]
        C4["Automated Regulatory Reports"]
        C5["Audit Trail & Evidence Repository"]
        C6["ESG Framework Gap Analysis"]
      end
    end
    subgraph Stage5 ["5) Reports & Analytics"]
      direction LR
      subgraph S5Col1 [ ]
        R1["Fleet ESG Dashboard (Per Vehicle)"]
        R2["B2G Government Portal"]
        R3["Third-Party Auditor API"]
        R4["Public Sustainability Page"]
        R5["SDG Contribution Dashboard"]
      end
      subgraph S5Col2 [ ]
        R6["Carbon Footprint (Scope 1, 2, 3)"]
        R7["AI Water/Chemical/Energy Optimisation"]
        R8["Carbon Offset Management"]
        R9["Goal Progress Tracking"]
        R10["ESG-Linked Incentives"]
        R11["Benchmarking & Best Practices"]
      end
    end
    Stage1 --> Stage2 --> Stage3 --> Stage4 --> Stage5
    style Stage1 fill:#dae8fc,stroke:#6c8ebf
    style Stage2 fill:#d5e8d4,stroke:#82b366
    style Stage3 fill:#ffe6cc,stroke:#d79b00
    style Stage4 fill:#fff2cc,stroke:#d6b656
    style Stage5 fill:#e1d5e7,stroke:#9673a6
    style S1Col1 fill:none,stroke:none
    style S1Col2 fill:none,stroke:none
    style S2Col1 fill:none,stroke:none
    style S2Col2 fill:none,stroke:none
    style S3Col1 fill:none,stroke:none
    style S3Col2 fill:none,stroke:none
    style S4Col1 fill:none,stroke:none
    style S4Col2 fill:none,stroke:none
    style S5Col1 fill:none,stroke:none
    style S5Col2 fill:none,stroke:none
  `;

  // ─────────── 2) DETAILING STUDIOS ───────────
  const detailing = `flowchart TD
    subgraph Stage1 ["1) Foundation & Governance"]
      direction LR
      subgraph S1Col1 [ ]
        G1["ESG Policy & Strategy"]
        G2["Framework Alignment"]
        G3["SDG Goal Mapping"]
      end
      subgraph S1Col2 [ ]
        G4["Goal Setting (VOC, Energy, Waste)"]
        G5["Org Hierarchy & RBAC"]
        G6["Compliance Calendar"]
      end
    end
    subgraph Stage2 ["2) Data Collection & IoT Pipeline"]
      direction LR
      subgraph S2Col1 [ ]
        D1["VOC & Indoor Air Quality Sensors"]
        D2["Energy & Extraction Monitors"]
        D3["Edge Gateway"]
        D7["Lab Report Scheduler & Template"]
      end
      subgraph S2Col2 [ ]
        D4["Offline Buffer & Auto-Sync"]
        D5["Telemetry Ingestion"]
        D6["Waste Stream Tracking"]
        D8["Manual Metric Entry for Lab Results"]
      end
    end
    subgraph Stage3 ["3) Monitoring & Real-Time Insights"]
      direction LR
      subgraph S3Col1 [ ]
        M1["Per-Job Energy & Materials"]
        M2["VOC & Air Quality Levels"]
        M3["Chemical Usage per Service"]
        M4["Site-Level Dashboards"]
        M9["Water Quality Dashboard<br/>(if water‑based processes)"]
      end
      subgraph S3Col2 [ ]
        M5["Leakage & Anomaly Detection"]
        M6["Sustainability Score (per service)"]
        M7["Waste Classification"]
        M8["Before/After AI Quality"]
        M10["ETP/Discharge Score (if applicable)"]
      end
    end
    subgraph Stage4 ["4) Compliance & Regulatory Mgmt"]
      direction LR
      subgraph S4Col1 [ ]
        C1["Permit Monitoring (Air, Chemical Storage)"]
        C2["Threshold Alerts (Inc. Lab)"]
        C3["Corrective Actions"]
      end
      subgraph S4Col2 [ ]
        C4["Automated Reports"]
        C5["Audit Trail"]
        C6["Framework Gap Analysis"]
      end
    end
    subgraph Stage5 ["5) Reports & Analytics"]
      direction LR
      subgraph S5Col1 [ ]
        R1["Fleet/Dealer ESG Dashboards"]
        R2["B2G Portal"]
        R3["Auditor API"]
        R4["Public Sustainability Page"]
        R5["SDG Contribution Dashboard"]
      end
      subgraph S5Col2 [ ]
        R6["Carbon Footprint (Scope 1,2,3)"]
        R7["AI Chemical/VOC/Energy Optimisation"]
        R8["Carbon Offset Management"]
        R9["Goal Tracking"]
        R10["ESG Incentives"]
        R11["Benchmarking"]
      end
    end
    Stage1 --> Stage2 --> Stage3 --> Stage4 --> Stage5
    style Stage1 fill:#dae8fc,stroke:#6c8ebf
    style Stage2 fill:#d5e8d4,stroke:#82b366
    style Stage3 fill:#ffe6cc,stroke:#d79b00
    style Stage4 fill:#fff2cc,stroke:#d6b656
    style Stage5 fill:#e1d5e7,stroke:#9673a6
    style S1Col1 fill:none,stroke:none
    style S1Col2 fill:none,stroke:none
    style S2Col1 fill:none,stroke:none
    style S2Col2 fill:none,stroke:none
    style S3Col1 fill:none,stroke:none
    style S3Col2 fill:none,stroke:none
    style S4Col1 fill:none,stroke:none
    style S4Col2 fill:none,stroke:none
    style S5Col1 fill:none,stroke:none
    style S5Col2 fill:none,stroke:none
  `;

  // ─────────── 3) WASH ON THE GO ───────────
  const mobile = `flowchart TD
    subgraph Stage1 ["1) Foundation & Governance"]
      direction LR
      subgraph S1Col1 [ ]
        G1["ESG Policy & Strategy"]
        G2["Framework Alignment"]
        G3["SDG Goal Mapping"]
      end
      subgraph S1Col2 [ ]
        G4["Goal Setting (Fuel, Water, Carbon)"]
        G5["Org Hierarchy & RBAC"]
        G6["Compliance Calendar"]
      end
    end
    subgraph Stage2 ["2) Data Collection & IoT Pipeline"]
      direction LR
      subgraph S2Col1 [ ]
        D1["Van Fuel/Energy Sensors"]
        D2["Water Tank Level Sensors"]
        D3["Mobile Edge Gateway"]
        D7["Lab Report Scheduler (if water sources tested)"]
      end
      subgraph S2Col2 [ ]
        D4["Offline Buffer & Auto-Sync"]
        D5["Telemetry (Fuel, Water, GPS)"]
        D6["Chemical Usage Tracking"]
        D8["Manual Metric Entry (water quality)"]
      end
    end
    subgraph Stage3 ["3) Monitoring & Real-Time Insights"]
      direction LR
      subgraph S3Col1 [ ]
        M1["Per-Job Fuel & Water Metrics"]
        M2["Chemical Consumption per Job"]
        M3["Van & Hub Dashboards"]
        M4["Route Efficiency & Emissions"]
        M9["Water Quality Dashboard (if applicable)"]
      end
      subgraph S3Col2 [ ]
        M5["Leakage & Idle Alerts"]
        M6["Sustainability Score (per service)"]
        M7["Waste Tracking"]
        M10["Discharge Performance (if any ETP)"]
      end
    end
    subgraph Stage4 ["4) Compliance & Regulatory Mgmt"]
      direction LR
      subgraph S4Col1 [ ]
        C1["Mobile Vendor Permits"]
        C2["Threshold Alerts (Inc. Lab)"]
        C3["Corrective Actions"]
      end
      subgraph S4Col2 [ ]
        C4["Automated Reports"]
        C5["Audit Trail"]
        C6["Framework Gap Analysis"]
      end
    end
    subgraph Stage5 ["5) Reports & Analytics"]
      direction LR
      subgraph S5Col1 [ ]
        R1["Fleet ESG Dashboard"]
        R2["B2G Portal"]
        R3["Auditor API"]
        R4["Public Sustainability Page"]
        R5["SDG Contribution Dashboard"]
      end
      subgraph S5Col2 [ ]
        R6["Carbon Footprint (Scope 1,2,3)"]
        R7["AI Route/Fuel/Water Optimisation"]
        R8["Carbon Offset Management"]
        R9["Goal Tracking"]
        R10["ESG Incentives"]
        R11["Benchmarking"]
      end
    end
    Stage1 --> Stage2 --> Stage3 --> Stage4 --> Stage5
    style Stage1 fill:#dae8fc,stroke:#6c8ebf
    style Stage2 fill:#d5e8d4,stroke:#82b366
    style Stage3 fill:#ffe6cc,stroke:#d79b00
    style Stage4 fill:#fff2cc,stroke:#d6b656
    style Stage5 fill:#e1d5e7,stroke:#9673a6
    style S1Col1 fill:none,stroke:none
    style S1Col2 fill:none,stroke:none
    style S2Col1 fill:none,stroke:none
    style S2Col2 fill:none,stroke:none
    style S3Col1 fill:none,stroke:none
    style S3Col2 fill:none,stroke:none
    style S4Col1 fill:none,stroke:none
    style S4Col2 fill:none,stroke:none
    style S5Col1 fill:none,stroke:none
    style S5Col2 fill:none,stroke:none
  `;

  // ─────────── 4) PRODUCT SALES ───────────
  const productSales = `flowchart TD
    subgraph Stage1 ["1) Foundation & Governance"]
      direction LR
      subgraph S1Col1 [ ]
        G1["ESG Policy & Strategy"]
        G2["Framework Alignment"]
        G3["SDG Goal Mapping (12)"]
      end
      subgraph S1Col2 [ ]
        G4["Goal Setting (Packaging, Carbon, Waste)"]
        G5["Org Hierarchy & RBAC"]
        G6["Compliance Calendar"]
      end
    end
    subgraph Stage2 ["2) Data Collection & IoT Pipeline"]
      direction LR
      subgraph S2Col1 [ ]
        D1["Warehouse Energy/Water Sensors"]
        D2["Product Lifecycle Data"]
        D3["Edge Gateway"]
        D7["Lab Report Scheduler (if local water testing)"]
      end
      subgraph S2Col2 [ ]
        D4["Offline Buffer & Auto-Sync"]
        D5["Telemetry Ingestion"]
        D6["Waste & Packaging Tracking"]
        D8["Manual Metric Entry (product quality water)"]
      end
    end
    subgraph Stage3 ["3) Monitoring & Real-Time Insights"]
      direction LR
      subgraph S3Col1 [ ]
        M1["Product Lifecycle Carbon (per SKU)"]
        M2["Warehouse Energy & Emissions"]
        M3["Packaging Waste Metrics"]
        M4["Site-Level Dashboards"]
        M9["Water Quality Dashboard (if ware‑ house uses ETP)"]
      end
      subgraph S3Col2 [ ]
        M5["Anomaly Detection"]
        M6["Sustainability Score (per product)"]
        M7["Supplier ESG Ratings"]
        M8["Inventory Waste Tracking"]
        M10["Discharge Compliance Score"]
      end
    end
    subgraph Stage4 ["4) Compliance & Regulatory Mgmt"]
      direction LR
      subgraph S4Col1 [ ]
        C1["Hazardous Material Permits"]
        C2["Threshold Alerts (Inc. Lab)"]
        C3["Corrective Actions"]
      end
      subgraph S4Col2 [ ]
        C4["Automated Reports"]
        C5["Audit Trail"]
        C6["Framework Gap Analysis"]
      end
    end
    subgraph Stage5 ["5) Reports & Analytics"]
      direction LR
      subgraph S5Col1 [ ]
        R1["Distributor ESG Dashboards"]
        R2["B2G Portal"]
        R3["Auditor API"]
        R4["Public Sustainability Page"]
        R5["SDG Contribution Dashboard"]
      end
      subgraph S5Col2 [ ]
        R6["Carbon Footprint (Scope 1,2,3)"]
        R7["AI Packaging/Logistics Optimisation"]
        R8["Carbon Offset Management"]
        R9["Goal Tracking"]
        R10["ESG Incentives"]
        R11["Supplier & Product Benchmarking"]
      end
    end
    Stage1 --> Stage2 --> Stage3 --> Stage4 --> Stage5
    style Stage1 fill:#dae8fc,stroke:#6c8ebf
    style Stage2 fill:#d5e8d4,stroke:#82b366
    style Stage3 fill:#ffe6cc,stroke:#d79b00
    style Stage4 fill:#fff2cc,stroke:#d6b656
    style Stage5 fill:#e1d5e7,stroke:#9673a6
    style S1Col1 fill:none,stroke:none
    style S1Col2 fill:none,stroke:none
    style S2Col1 fill:none,stroke:none
    style S2Col2 fill:none,stroke:none
    style S3Col1 fill:none,stroke:none
    style S3Col2 fill:none,stroke:none
    style S4Col1 fill:none,stroke:none
    style S4Col2 fill:none,stroke:none
    style S5Col1 fill:none,stroke:none
    style S5Col2 fill:none,stroke:none
  `;

  const flows = {
    "Vehicle Wash": vehicleWash,
    "Detailing Studios": detailing,
    "Wash on the Go": mobile,
    "Product Sales": productSales
  };

  const tabContainer = document.getElementById('tabs');
  const diagramDiv = document.getElementById('diagram');
  let currentKey = "Vehicle Wash";

  Object.keys(flows).forEach(key => {
    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.textContent = key;
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentKey = key;
      diagramDiv.innerHTML = flows[key];
      diagramDiv.removeAttribute('data-processed');
      mermaid.run({ nodes: [diagramDiv] });
    });
    tabContainer.appendChild(tab);
  });

  document.querySelector('.tab').classList.add('active');
  diagramDiv.innerHTML = flows[currentKey];
  mermaid.run({ nodes: [diagramDiv] });
});
</script>
</body>
</html>
