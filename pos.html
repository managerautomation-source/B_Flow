<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master POS FRD – Business‑Specific (Tailored) Module Coverage</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #f5f7fa; }
  h1 { text-align: center; color: #222; }
  .tabs { display: flex; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
  .tab { background: #e0e0e0; padding: 10px 20px; margin: 5px; border-radius: 20px; cursor: pointer; font-weight: 600; color: #333; }
  .tab.active { background: #1a73e8; color: white; }
  .diagram-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow-x: auto; }
  .mermaid { display: flex; justify-content: center; }
</style>
</head>
<body>
<h1>💳 Business‑Specific POS Module Coverage (5 Flows, Tailored)</h1>
<div class="tabs" id="tabs"></div>
<div class="diagram-container">
  <div class="mermaid" id="diagram"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  mermaid.initialize({ startOnLoad: false, theme: 'default' });

  // ── 1) VEHICLE WASH ──
  const vehicleWash = `flowchart TD
    subgraph Core ["1) Core Setup"]
      M1["Multi-Business Architecture"]
      M15["Multi-Country & Localisation"]
      M16["Privacy & Security"]
    end
    subgraph Catalogue ["2) Catalogue & Pricing"]
      M2["Service & Product Catalogue"]
      M4["Discounts & Promotions"]
    end
    subgraph Sales ["3) Sales & Payments"]
      M3["Transaction Processing"]
      M5["Membership & Subscription"]
      M6["Service Books"]
      M8["B2B Contract Management"]
      M10["Loyalty Programme"]
      M11["Gift Cards & Vouchers"]
      M12["Cash Management"]
      M_comm["Commission Mgmt"]
      M_aff["Affiliate Management"]
      M_ref["Refer & Earn"]
      M14["POS Analytics"]
    end
    subgraph Integration ["4) Integration & Job Lifecycle"]
      M19["Integrations Hub"]
      M20["Job Card Lifecycle"]
      M13["Staff Management"]
    end
    subgraph AfterSales ["5) After-Sales & Warranty"]
      M7["Warranty Management"]
      M18["Consent & Sign-off"]
    end
    Core --> Catalogue --> Sales
    Sales --> Integration
    Sales --> AfterSales
    style Core fill:#dae8fc,stroke:#6c8ebf
    style Catalogue fill:#d5e8d4,stroke:#82b366
    style Sales fill:#ffe6cc,stroke:#d79b00
    style Integration fill:#d4e6f1,stroke:#2980b9
    style AfterSales fill:#fff2cc,stroke:#d6b656
  `;

  // ── 2) DETAILING STUDIOS ──
  const detailing = `flowchart TD
    subgraph Core ["1) Core Setup"]
      M1["Multi-Business Architecture"]
      M15["Multi-Country & Localisation"]
      M16["Privacy & Security"]
    end
    subgraph Catalogue ["2) Catalogue & Pricing"]
      M2["Service & Product Catalogue"]
      M4["Discounts & Promotions"]
    end
    subgraph Sales ["3) Sales & Payments"]
      M3["Transaction Processing"]
      M5["Membership & Subscription"]
      M6["Service Books"]
      M8["B2B Contract Management"]
      M10["Loyalty Programme"]
      M11["Gift Cards & Vouchers"]
      M12["Cash Management"]
      M_comm["Commission Mgmt"]
      M_aff["Affiliate Management"]
      M_ref["Refer & Earn"]
      M14["POS Analytics"]
    end
    subgraph Integration ["4) Integration & Job Lifecycle"]
      M19["Integrations Hub"]
      M20["Job Card Lifecycle"]
      M13["Staff Management"]
    end
    subgraph AfterSales ["5) After-Sales & Warranty"]
      M7["Warranty Management"]
      M18["Consent & Sign-off"]
    end
    Core --> Catalogue --> Sales
    Sales --> Integration
    Sales --> AfterSales
    style Core fill:#dae8fc,stroke:#6c8ebf
    style Catalogue fill:#d5e8d4,stroke:#82b366
    style Sales fill:#ffe6cc,stroke:#d79b00
    style Integration fill:#d4e6f1,stroke:#2980b9
    style AfterSales fill:#fff2cc,stroke:#d6b656
  `;

  // ── 3) WASH ON THE GO ──
  const mobile = `flowchart TD
    subgraph Core ["1) Core Setup"]
      M1["Multi-Business Architecture"]
      M15["Multi-Country & Localisation"]
      M16["Privacy & Security"]
    end
    subgraph Catalogue ["2) Catalogue & Pricing"]
      M2["Service & Product Catalogue"]
      M4["Discounts & Promotions"]
    end
    subgraph Sales ["3) Sales & Payments"]
      M3["Transaction Processing"]
      M5["Membership & Subscription"]
      M6["Service Books"]
      M8["B2B Contract Management"]
      M10["Loyalty Programme"]
      M11["Gift Cards & Vouchers"]
      M12["Cash Management"]
      M_comm["Commission Mgmt"]
      M_aff["Affiliate Management"]
      M_ref["Refer & Earn"]
      M14["POS Analytics"]
    end
    subgraph Integration ["4) Integration & Job Lifecycle"]
      M19["Integrations Hub"]
      M20["Job Card Lifecycle"]
      M13["Staff Management"]
    end
    subgraph AfterSales ["5) After-Sales & Warranty"]
      M7["Warranty Management"]
      M18["Consent & Sign-off"]
    end
    Core --> Catalogue --> Sales
    Sales --> Integration
    Sales --> AfterSales
    style Core fill:#dae8fc,stroke:#6c8ebf
    style Catalogue fill:#d5e8d4,stroke:#82b366
    style Sales fill:#ffe6cc,stroke:#d79b00
    style Integration fill:#d4e6f1,stroke:#2980b9
    style AfterSales fill:#fff2cc,stroke:#d6b656
  `;

  // ── 4) PRODUCT SALES ── (different set)
  const productSales = `flowchart TD
    subgraph Core ["1) Core Setup"]
      M1["Multi-Business Architecture"]
      M15["Multi-Country & Localisation"]
      M16["Privacy & Security"]
    end
    subgraph Catalogue ["2) Catalogue & Pricing"]
      M2["Service & Product Catalogue"]
      M4["Discounts & Promotions"]
    end
    subgraph Sales ["3) Sales & Payments"]
      M3["Transaction Processing"]
      M17["E-commerce / Digital Sales"]
      M8["B2B Contract Management"]
      M10["Loyalty Programme"]
      M11["Gift Cards & Vouchers"]
      M12["Cash Management"]
      M_comm["Commission Mgmt"]
      M_aff["Affiliate Management"]
      M_ref["Refer & Earn"]
      M14["POS Analytics"]
    end
    subgraph Integration ["4) Integration & Job Lifecycle"]
      M19["Integrations Hub"]
      M20["Job Card Lifecycle"]
      M13["Staff Management"]
    end
    subgraph AfterSales ["5) After-Sales & Warranty"]
      M7["Warranty Management"]
      M18["Consent & Sign-off"]
    end
    Core --> Catalogue --> Sales
    Sales --> Integration
    Sales --> AfterSales
    style Core fill:#dae8fc,stroke:#6c8ebf
    style Catalogue fill:#d5e8d4,stroke:#82b366
    style Sales fill:#ffe6cc,stroke:#d79b00
    style Integration fill:#d4e6f1,stroke:#2980b9
    style AfterSales fill:#fff2cc,stroke:#d6b656
  `;

  const flows = {
    "Vehicle Wash": vehicleWash,
    "Detailing Studios": detailing,
    "Wash on the Go": mobile,
    "Product Sales": productSales
  };

  const tabContainer = document.getElementById('tabs');
  const diagramDiv = document.getElementById('diagram');
  let currentKey = "Vehicle Wash";

  Object.keys(flows).forEach(key => {
    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.textContent = key;
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentKey = key;
      diagramDiv.innerHTML = flows[key];
      diagramDiv.removeAttribute('data-processed');
      mermaid.run({ nodes: [diagramDiv] });
    });
    tabContainer.appendChild(tab);
  });

  document.querySelector('.tab').classList.add('active');
  diagramDiv.innerHTML = flows[currentKey];
  mermaid.run({ nodes: [diagramDiv] });
});
</script>
</body>
</html>
