<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master POS FRD – Business‑Specific Module Coverage</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #f5f7fa; }
  h1 { text-align: center; color: #222; }
  .tabs { display: flex; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
  .tab { background: #e0e0e0; padding: 10px 20px; margin: 5px; border-radius: 20px; cursor: pointer; font-weight: 600; color: #333; }
  .tab.active { background: #1a73e8; color: white; }
  .diagram-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow-x: auto; }
  .mermaid { display: flex; justify-content: center; }
</style>
</head>
<body>
<h1>💳 Business‑Specific POS Module Coverage</h1>
<div class="tabs" id="tabs"></div>
<div class="diagram-container">
  <div class="mermaid" id="diagram"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  mermaid.initialize({ startOnLoad: false, theme: 'default' });

  const flows = {
    "Vehicle Wash": `flowchart TD
      subgraph Core ["Core Setup"]
        M1["1) Multi-Business Architecture"]
        M15["15) Multi-Country & Localisation"]
        M16["16) Privacy & Security"]
      end
      subgraph Catalogue ["Catalogue & Pricing"]
        M2["2) Service & Product Catalogue"]
        M4["4) Discounts & Promotions"]
      end
      subgraph Sales ["Sales & Payments"]
        M3["3) Transaction Processing"]
        M10["10) Loyalty Programme"]
        M11["11) Gift Cards & Vouchers"]
        M12["12) Cash Management"]
        M13["13) Staff Management"]
        M14["14) POS Analytics"]
      end
      subgraph Subscriptions ["Subscriptions & Books"]
        M5["5) Membership & Subscription"]
        M6["6) Service Books"]
      end
      subgraph Contracts ["Fleet & Dealer Contracts"]
        M8["8) B2B Contract Management"]
      end
      subgraph AfterSales ["After-Sales & Warranty"]
        M7["7) Warranty Management"]
        M18["18) Consent & Sign-off"]
      end
      subgraph Integration ["Integrations & Job Lifecycle"]
        M19["19) Integrations Hub"]
        M20["20) Job Card Lifecycle"]
      end
      Core --> Catalogue --> Sales
      Sales --> Subscriptions
      Sales --> Contracts
      Sales --> AfterSales
      Sales --> Integration
      style Core fill:#dae8fc,stroke:#6c8ebf
      style Catalogue fill:#d5e8d4,stroke:#82b366
      style Sales fill:#ffe6cc,stroke:#d79b00
      style Subscriptions fill:#e1d5e7,stroke:#9673a6
      style Contracts fill:#f8cecc,stroke:#b85450
      style AfterSales fill:#fff2cc,stroke:#d6b656
      style Integration fill:#d4e6f1,stroke:#2980b9
    `,

    "Detailing Studios": `flowchart TD
      subgraph Core ["Core Setup"]
        M1["1) Multi-Business Architecture"]
        M15["15) Multi-Country & Localisation"]
        M16["16) Privacy & Security"]
      end
      subgraph Catalogue ["Catalogue & Pricing"]
        M2["2) Service & Product Catalogue"]
        M4["4) Discounts & Promotions"]
      end
      subgraph Sales ["Sales & Payments"]
        M3["3) Transaction Processing"]
        M10["10) Loyalty Programme"]
        M11["11) Gift Cards & Vouchers"]
        M12["12) Cash Management"]
        M13["13) Staff Management"]
        M14["14) POS Analytics"]
      end
      subgraph Subscriptions ["Subscriptions & Books"]
        M5["5) Membership & Subscription"]
        M6["6) Service Books"]
      end
      subgraph Contracts ["Dealer & OEM Contracts"]
        M8["8) B2B Contract Management"]
      end
      subgraph AfterSales ["After-Sales & Warranty"]
        M7["7) Warranty Management"]
        M18["18) Consent & Sign-off"]
      end
      subgraph Integration ["Integrations & Job Lifecycle"]
        M19["19) Integrations Hub"]
        M20["20) Job Card Lifecycle"]
      end
      Core --> Catalogue --> Sales
      Sales --> Subscriptions
      Sales --> Contracts
      Sales --> AfterSales
      Sales --> Integration
      style Core fill:#dae8fc,stroke:#6c8ebf
      style Catalogue fill:#d5e8d4,stroke:#82b366
      style Sales fill:#ffe6cc,stroke:#d79b00
      style Subscriptions fill:#e1d5e7,stroke:#9673a6
      style Contracts fill:#f8cecc,stroke:#b85450
      style AfterSales fill:#fff2cc,stroke:#d6b656
      style Integration fill:#d4e6f1,stroke:#2980b9
    `,

    "Wash on the Go": `flowchart TD
      subgraph Core ["Core Setup"]
        M1["1) Multi-Business Architecture"]
        M15["15) Multi-Country & Localisation"]
        M16["16) Privacy & Security"]
      end
      subgraph Catalogue ["Catalogue & Pricing"]
        M2["2) Service & Product Catalogue"]
        M4["4) Discounts & Promotions"]
      end
      subgraph Sales ["Sales & Payments"]
        M3["3) Transaction Processing"]
        M10["10) Loyalty Programme"]
        M11["11) Gift Cards & Vouchers"]
        M12["12) Cash Management"]
        M13["13) Staff Management"]
        M14["14) POS Analytics"]
      end
      subgraph Subscriptions ["Subscriptions & Books"]
        M5["5) Membership & Subscription"]
        M6["6) Service Books"]
      end
      subgraph Contracts ["Corporate Contracts"]
        M8["8) B2B Contract Management"]
      end
      subgraph AfterSales ["After-Sales & Warranty"]
        M7["7) Warranty Management"]
        M18["18) Consent & Sign-off"]
      end
      subgraph Integration ["Integrations & Job Lifecycle"]
        M19["19) Integrations Hub"]
        M20["20) Job Card Lifecycle"]
      end
      Core --> Catalogue --> Sales
      Sales --> Subscriptions
      Sales --> Contracts
      Sales --> AfterSales
      Sales --> Integration
      style Core fill:#dae8fc,stroke:#6c8ebf
      style Catalogue fill:#d5e8d4,stroke:#82b366
      style Sales fill:#ffe6cc,stroke:#d79b00
      style Subscriptions fill:#e1d5e7,stroke:#9673a6
      style Contracts fill:#f8cecc,stroke:#b85450
      style AfterSales fill:#fff2cc,stroke:#d6b656
      style Integration fill:#d4e6f1,stroke:#2980b9
    `,

    "Product Sales": `flowchart TD
      subgraph Core ["Core Setup"]
        M1["1) Multi-Business Architecture"]
        M15["15) Multi-Country & Localisation"]
        M16["16) Privacy & Security"]
      end
      subgraph Catalogue ["Product Catalogue"]
        M2["2) Service & Product Catalogue"]
        M4["4) Discounts & Promotions"]
      end
      subgraph Sales ["Sales & Payments"]
        M3["3) Transaction Processing"]
        M10["10) Loyalty Programme"]
        M11["11) Gift Cards & Vouchers"]
        M12["12) Cash Management"]
        M13["13) Staff Management"]
        M14["14) POS Analytics"]
      end
      subgraph eCommerce ["Digital Sales"]
        M17["17) E-commerce / Digital Sales"]
      end
      subgraph AfterSales ["After-Sales & Warranty"]
        M7["7) Warranty Management"]
        M18["18) Consent & Sign-off"]
      end
      subgraph Integration ["Integrations & Job Lifecycle"]
        M19["19) Integrations Hub"]
        M20["20) Job Card Lifecycle"]
      end
      Core --> Catalogue --> Sales
      Sales --> eCommerce
      Sales --> AfterSales
      Sales --> Integration
      style Core fill:#dae8fc,stroke:#6c8ebf
      style Catalogue fill:#d5e8d4,stroke:#82b366
      style Sales fill:#ffe6cc,stroke:#d79b00
      style eCommerce fill:#cce5ff,stroke:#007acc
      style AfterSales fill:#fff2cc,stroke:#d6b656
      style Integration fill:#d4e6f1,stroke:#2980b9
    `
  };

  const tabContainer = document.getElementById('tabs');
  const diagramDiv = document.getElementById('diagram');
  let currentKey = "Vehicle Wash";

  Object.keys(flows).forEach(key => {
    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.textContent = key;
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentKey = key;
      diagramDiv.innerHTML = flows[key];
      diagramDiv.removeAttribute('data-processed');
      mermaid.run({ nodes: [diagramDiv] });
    });
    tabContainer.appendChild(tab);
  });

  document.querySelector('.tab').classList.add('active');
  diagramDiv.innerHTML = flows[currentKey];
  mermaid.run({ nodes: [diagramDiv] });
});
</script>
</body>
</html>
